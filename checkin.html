<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#6d1f2f">
<title>Wedding Check-in</title>
<style>
:root{--bg:#fbf7f2;--card:#fff;--ink:#2a1f22;--mut:#6b6165;--line:#e6ddd3;--rose:#6d1f2f;--ok:#1b8a4f;--bad:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#16110f;--card:#211a1c;--ink:#f2e9e4;--mut:#b5a9ad;--line:#3a2f31;--rose:#b04a5f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  padding:max(14px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom))}
.wrap{max-width:460px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 14px}
h1{font-size:1.25rem;margin:0}
h1 small{display:block;font-weight:400;font-size:.8rem;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
label{display:block;font-size:.85rem;color:var(--mut);margin:0 0 6px}
input{width:100%;min-height:50px;padding:0 14px;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px}
input:focus{outline:2px solid var(--rose);border-color:transparent}
button{font:inherit;font-size:16px;min-height:50px;padding:0 18px;border:0;border-radius:12px;background:var(--rose);color:#fff;font-weight:600;cursor:pointer}
button:active{transform:scale(.98)}button:disabled{opacity:.5}
button.ghost{background:transparent;color:var(--rose);border:1.5px solid var(--rose);min-height:40px;padding:0 14px;font-size:.9rem}
button.full{width:100%;margin-top:12px}
.pw,.row{display:flex;gap:8px}.pw input,.row input{flex:1;min-width:0}
.pw button{min-width:76px;background:transparent;color:var(--rose);border:1.5px solid var(--rose)}
.msg{min-height:1.2em;margin:10px 0 0;color:var(--bad);font-size:.9rem}
#viewfinder{position:relative;width:100%;aspect-ratio:1;border-radius:14px;overflow:hidden;background:#000;margin-bottom:12px}
#vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#viewfinder .frame{position:absolute;inset:16%;border:3px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.38)}
#res{border-radius:18px;padding:22px 16px;text-align:center;color:#fff;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#res.ok{background:var(--ok)}#res.bad{background:var(--bad)}
#res .icon{font-size:3rem;line-height:1}
#res .status{font-size:1.9rem;font-weight:800;letter-spacing:.04em;margin:6px 0 10px}
#res .name{font-size:1.45rem;font-weight:700;line-height:1.2;word-break:break-word}
#res .line{font-size:1.1rem;margin:4px 0;opacity:.95}
#res .ref{display:inline-block;margin-top:12px;padding:4px 12px;border-radius:99px;background:rgba(255,255,255,.22);font-size:.9rem;letter-spacing:.06em}
#res .hint{margin-top:12px;font-size:.8rem;opacity:.8}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Wedding Check-in<small>Tosin &amp; Raphael &middot; 5 December 2026</small></h1>
    <button class="ghost" id="lockBtn" hidden>Lock</button>
  </header>

  <!-- Step 1: enter the key once -->
  <section class="card" id="login">
    <label for="k">Usher key</label>
    <div class="pw">
      <input id="k" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Enter usher key">
      <button type="button" id="eye">Show</button>
    </div>
    <button class="full" id="unlock">Unlock</button>
    <p class="msg" id="loginMsg" role="alert"></p>
  </section>

  <!-- Step 2: scan guests (no key needed again) -->
  <section id="app" hidden>
    <div id="res" hidden role="status"></div>

    <div class="card">
      <div id="viewfinder" hidden><video id="vid" playsinline muted autoplay></video><div class="frame"></div></div>
      <button class="full" id="camBtn" style="margin-top:0">Start camera</button>
      <button class="ghost full" id="photoBtn" type="button" style="margin-top:10px;width:100%">Scan by taking a photo instead</button>
      <input type="file" id="photoIn" accept="image/*" capture="environment" hidden>
            <p class="msg" id="camMsg"></p>
    </div>

    <div class="card">
      <label for="ref">Or type the reference (e.g. ART-ZMLPYY)</label>
      <div class="row">
        <input id="ref" placeholder="ART-XXXXXX" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false">
        <button id="chk">Check</button>
      </div>
    </div>
  </section>
</div>

<script src="jsQR.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const store = { get: () => { try { const o = JSON.parse(localStorage.getItem("usherKey") || "null"); return o && Date.now() - o.t < 12 * 3600e3 ? o.k : null; } catch (e) { return null; } },  // saved key expires after 12 hours
                set: (v) => { try { localStorage.setItem("usherKey", JSON.stringify({ k: v, t: Date.now() })); } catch (e) {} },
                del: () => { try { localStorage.removeItem("usherKey"); } catch (e) {} } };
let KEY = "", scanner = null, running = false, last = { code: "", t: 0 }, audio = null;

/* ---------- sound + vibration ---------- */
function beep(good) {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const tones = good ? [[880, 0, .16]] : [[240, 0, .2], [240, .28, .2]];
    tones.forEach(([f, at, d]) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = f; o.type = "sine"; g.gain.value = .25;
      o.connect(g); g.connect(audio.destination);
      o.start(audio.currentTime + at); o.stop(audio.currentTime + at + d);
    });
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate(good ? 120 : [200, 100, 200]);
}

/* ---------- unlock (key entered once, remembered on this phone) ---------- */
$("eye").onclick = () => { const i = $("k"), show = i.type === "password"; i.type = show ? "text" : "password"; $("eye").textContent = show ? "Hide" : "Show"; };
$("k").addEventListener("keydown", (e) => { if (e.key === "Enter") unlock(); });
$("unlock").onclick = unlock;

async function verify(key) {
  try {
    const r = await fetch("/api/admin/ping", { headers: { "x-admin-key": key } });
    return r.ok ? "ok" : r.status === 401 ? "wrong" : r.status === 429 ? "locked" : "error";
  } catch (e) { return "offline"; }
}
async function unlock() {
  const key = $("k").value.trim();
  if (!key) { $("loginMsg").textContent = "Please enter the usher key."; return; }
  $("unlock").disabled = true; $("loginMsg").textContent = "";
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) {}
  const v = await verify(key);
  $("unlock").disabled = false;
  if (v === "wrong") { $("loginMsg").textContent = "Wrong usher key. Please try again."; return; }
  if (v === "locked") { $("loginMsg").textContent = "Too many wrong attempts. Please wait 15 minutes."; return; }
  if (v !== "ok") { $("loginMsg").textContent = "Cannot reach the server. Check your internet connection."; return; }
  KEY = key; store.set(key); showApp(); startCamera();
}
function showApp() { $("login").hidden = true; $("app").hidden = false; $("lockBtn").hidden = false; $("k").value = ""; }
async function lock(msg) {
  await stopCamera(); store.del(); KEY = "";
  $("app").hidden = true; $("lockBtn").hidden = true; $("login").hidden = false; $("res").hidden = true;
  $("loginMsg").textContent = msg || "";
}
$("lockBtn").onclick = () => lock();

/* ---------- check a guest ---------- */
function normRef(text) {
  let id = String(text).split("|")[0].trim().toUpperCase().replace(/\s+/g, "");
  if (/^ART-[A-Z0-9]{6}$/.test(id)) return id;
  if (/^[A-Z0-9]{6}$/.test(id)) return "ART-" + id;          // typed without ART-
  if (/^ART[A-Z0-9]{6}$/.test(id)) return "ART-" + id.slice(3); // typed without the dash
  return id;
}
async function check(raw) {
  const id = normRef(raw);
  if (!id) return;
  let d;
  try {
    const r = await fetch("/api/admin/checkin", { method: "POST", headers: { "x-admin-key": KEY, "content-type": "application/json" }, body: JSON.stringify({ id }) });
    if (r.status === 401) return lock("The usher key is no longer valid. Please enter it again.");
    d = await r.json();
  } catch (e) { d = { result: "invalid", reason: "No connection. Please try again." }; }
  show(d, id);
}
function show(d, id) {
  const el = $("res"), ok = d.result === "valid", used = d.result === "used";
  el.className = ok ? "ok" : "bad"; el.hidden = false;
  const who = d.name ? `<div class="name">${esc(d.name)}</div><div class="line">${esc(d.category)}</div><div class="line">Table ${esc(d.tables)}</div>` : "";
  el.innerHTML =
    `<div class="icon">${ok ? "&#10004;" : "&#10006;"}</div>` +
    `<div class="status">${ok ? "VALID" : used ? "ALREADY USED" : "INVALID"}</div>` + who +
    (used ? `<div class="line">Already checked in at <b>${esc(d.at)}</b></div>` : "") +
    (ok ? `<div class="line">Checked in at ${esc(d.at)}</div>` : "") +
    (!ok && !used ? `<div class="line">${esc(d.reason || "Card not recognised")}</div>` : "") +
    `<div class="ref">${esc(d.id || id)}</div><div class="hint">Tap to dismiss</div>`;
  el.scrollIntoView({ behavior: "smooth", block: "start" });
  beep(ok);
}
$("res").onclick = () => { $("res").hidden = true; };

/* manual reference */
async function manual() {
  const v = $("ref").value; if (!v.trim()) return;
  $("chk").disabled = true; await check(v); $("chk").disabled = false;
  $("ref").value = ""; $("ref").blur();
}
$("chk").onclick = manual;
$("ref").addEventListener("keydown", (e) => { if (e.key === "Enter") manual(); });

/* ---------- camera (own scanner: camera + jsQR) ---------- */
let stream = null, loop = 0;
const work = document.createElement("canvas"), wctx = work.getContext("2d", { willReadFrequently: true });
const errName = (e) => String((e && (e.name || e.message)) || e || "");

function camHelp(e) {
  const n = errName(e);
  if (n === "insecure") return "The camera needs a secure (https) page. Use the live website address.";
  if (n === "unsupported") return "This browser cannot open the camera. If you opened the link from WhatsApp or another app, copy it and open it in Chrome or Safari.";
  if (n === "library") return "The scanner file did not load. Refresh the page and try again.";
  if (/NotAllowed|Permission|denied|SecurityError/i.test(n)) return "Camera access is blocked. On iPhone: open Settings, find your browser (Chrome or Safari), switch Camera on, then reload and tap Allow. In Safari you can also tap the aA icon, then Website Settings, then Camera, then Allow.";
  if (/NotFound|OverconstrainedError|no camera/i.test(n)) return "No usable camera was found on this device.";
  if (/NotReadable|TrackStart|in use|Abort/i.test(n)) return "The camera is busy. Close other apps or tabs that use the camera and try again.";
  return "The camera could not start.";
}
async function startCamera(auto) {
  $("camMsg").textContent = "";
  try {
    if (!window.isSecureContext) throw new Error("insecure");
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("unsupported");
    if (typeof jsQR === "undefined") throw new Error("library");
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } } });
    } catch (e1) {   // some phones reject the detailed request, so retry with the simplest one
      if (/NotAllowed|Permission|denied/i.test(errName(e1))) throw e1;
      stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: true });
    }
    const v = $("vid");
    v.setAttribute("playsinline", ""); v.muted = true; v.srcObject = stream;
    await v.play();
    $("viewfinder").hidden = false; running = true; $("camBtn").textContent = "Stop camera";
    scanLoop();
  } catch (e) {
    cleanupCamera();
    $("camMsg").textContent = auto
      ? "Tap Start camera to begin scanning."
      : camHelp(e) + " (" + errName(e).slice(0, 60) + ") You can also use the photo button or type the reference.";
  }
}
function scanLoop() {
  if (!running) return;
  const v = $("vid");
  if (v.readyState >= 2 && v.videoWidth) {
    const sc = Math.min(1, 720 / v.videoWidth);
    work.width = Math.floor(v.videoWidth * sc); work.height = Math.floor(v.videoHeight * sc);
    wctx.drawImage(v, 0, 0, work.width, work.height);
    const img = wctx.getImageData(0, 0, work.width, work.height);
    const code = jsQR(img.data, img.width, img.height, { inversionAttempts: "attemptBoth" });
    if (code && code.data) {   // ignore the same code seen again within 4 seconds
      const now = Date.now();
      if (!(code.data === last.code && now - last.t < 4000)) { last = { code: code.data, t: now }; check(code.data); }
    }
  }
  loop = setTimeout(scanLoop, 120);
}
function cleanupCamera() {
  running = false; clearTimeout(loop);
  if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
  const v = $("vid"); if (v) v.srcObject = null;
  $("viewfinder").hidden = true; $("camBtn").textContent = "Start camera";
}
async function stopCamera() { cleanupCamera(); }
$("camBtn").onclick = () => (running ? stopCamera() : startCamera());
document.addEventListener("visibilitychange", () => { if (document.hidden && running) stopCamera(); });

/* Backup: take a photo of the QR code */
$("photoBtn").onclick = () => $("photoIn").click();
$("photoIn").onchange = async (e) => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  $("camMsg").textContent = "Reading photo...";
  try {
    const bmp = await createImageBitmap(f);
    const sc = Math.min(1, 1400 / Math.max(bmp.width, bmp.height));
    work.width = Math.floor(bmp.width * sc); work.height = Math.floor(bmp.height * sc);
    wctx.drawImage(bmp, 0, 0, work.width, work.height);
    const img = wctx.getImageData(0, 0, work.width, work.height);
    const code = jsQR(img.data, img.width, img.height, { inversionAttempts: "attemptBoth" });
    if (!code) throw new Error("none");
    $("camMsg").textContent = ""; check(code.data);
  } catch (err) {
    $("camMsg").textContent = "Could not read a QR code from that photo. Hold the phone closer with the whole QR in the frame, or type the reference.";
  }
};

/* ---------- on page load: reuse the saved key ---------- */
(async () => {
  const saved = store.get();
  if (!saved) return;
  if (await verify(saved) === "ok") { KEY = saved; showApp(); startCamera(true); }
  else store.del();
})();
</script>
</body>
</html>
